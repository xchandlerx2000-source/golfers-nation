<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#24352d" />
    <meta name="application-name" content="Golfers Nation" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Golfers Nation" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Golfers Nation</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <div class="app-loading-shell" aria-label="Loading Golfers Nation">
        <div class="loading-card">
          <div class="loading-brand">
            <img src="/icons/icon-192.png" alt="" width="56" height="56" />
            <div class="loading-brand-copy">
              <p class="eyebrow">Golfers Nation</p>
              <strong class="loading-title">Launching your round companion</strong>
            </div>
          </div>
          <div class="loading-bar" aria-hidden="true">
            <span></span>
          </div>
          <p class="loading-caption">Preparing live rounds, player profiles, and your mobile app shell.</p>
        </div>
      </div>
    </div>
    <script>
      window.__GN_APP_BOOT_STARTED__ = false;
      window.__GN_APP_BOOT_FALLBACK_ACTIVE__ = false;

      window.__GN_CLEAR_CACHED_APP__ = async function () {
        try {
          if ("serviceWorker" in navigator && typeof navigator.serviceWorker.getRegistrations === "function") {
            var registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(function (registration) {
              return registration.unregister().catch(function () {
                return false;
              });
            }));
          }
        } catch (error) {
          console.warn("[Golfers Nation] Failed to unregister service workers during boot recovery.", error);
        }

        try {
          if ("caches" in window && typeof caches.keys === "function") {
            var cacheKeys = await caches.keys();
            await Promise.all(cacheKeys
              .filter(function (key) { return key.indexOf("golfers-nation-shell-") === 0; })
              .map(function (key) {
                return caches.delete(key).catch(function () {
                  return false;
                });
              }));
          }
        } catch (error) {
          console.warn("[Golfers Nation] Failed to clear cached shell assets during boot recovery.", error);
        }

        try {
          window.localStorage && window.localStorage.removeItem("golfers-nation-platform-v2");
        } catch (error) {
          console.warn("[Golfers Nation] Failed to clear local app state during boot recovery.", error);
        }

        var nextUrl = window.location.origin + window.location.pathname + "?boot-retry=" + Date.now();
        window.location.replace(nextUrl);
      };

      window.setTimeout(function () {
        var appRoot = document.getElementById("app");
        if (!window.__GN_APP_BOOT_STARTED__ && appRoot && !window.__GN_APP_BOOT_FALLBACK_ACTIVE__) {
          window.__GN_APP_BOOT_FALLBACK_ACTIVE__ = true;
          appRoot.innerHTML = '' +
            '<div class="boot-recovery-shell">' +
              '<div class="boot-recovery-card">' +
                '<h1>Golfers Nation could not finish loading</h1>' +
                '<p>The app shell loaded, but the live app did not start. This is usually a stale cached app shell on the device.</p>' +
                '<div class="boot-recovery-actions">' +
                  '<button class="button primary" type="button" onclick="window.location.reload()">Retry</button>' +
                  '<button class="button button-secondary" type="button" onclick="window.__GN_CLEAR_CACHED_APP__()">Clear cached app</button>' +
                '</div>' +
              '</div>' +
            '</div>';
        }
      }, 6000);
    </script>
    <script src="/runtime-config.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
